name: Portfolio quality and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-thumbnails.py
      - run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Build frozen visual reference
        run: |
          git worktree add --detach "$RUNNER_TEMP/portfolio-baseline" 72c8099810cd6da8df1f1c324cd1d587d588e0b8
          cd "$RUNNER_TEMP/portfolio-baseline"
          npm ci
          python scripts/optimize-thumbnails.py
          npm run build
      - run: npm run check
        env:
          VISUAL_BASELINE_DIST: ${{ runner.temp }}/portfolio-baseline/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: qa-artifacts/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check deployment SHA against current main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test -n "$latest"
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale revision $GITHUB_SHA (main is $latest)"
          fi
      - name: Deploy validated artifact to GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
