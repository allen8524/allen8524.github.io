name: Frontend QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Generate optimized thumbnails
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-thumbnails.py
      - run: npm run build
      - name: Install isolated browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/frontend-qa" --no-save playwright@1.56.1 axe-core@4.10.3
          "$RUNNER_TEMP/frontend-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Audit local production build
        env:
          QA_MODULES: ${{ runner.temp }}/frontend-qa/node_modules
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/frontend-preview.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/frontend-qa.mjs
